name: MyNews - 自動収集と公開
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7,12,20 * * *'
      timezone: 'Asia/Tokyo'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mynews-deploy
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 読書機能のテスト準備
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: テスト
        run: |
          python -m unittest discover -s tests -v
          npm test
          python scripts/build_reader_helper.py
          git diff --exit-code -- site/mynews-reader.user.js
      - name: ニュース取得
        run: python -m src.collect
      - name: 履歴をGitHubに保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update collected headlines'
            git push
          fi
      - name: Pagesセットアップ
        uses: actions/configure-pages@v5
      - name: 公開ファイルをパッケージ化
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
